<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equal World Shipping — Admin Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<main class="auth-card">
  <div class="brand-mark">EW</div>
  <h1>Equal World Shipping</h1>
  <p class="muted">Administrator sign in</p>
  <form id="loginForm">
    <label>Email<input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Password"></label>
    <button class="primary" type="submit">Sign in</button>
    <p id="loginError" class="error"></p>
  </form>
  <p class="demo-note">Demo mode: use <strong>admin@equalworldshipping.com</strong> / <strong>Admin123!</strong>. Replace this with Firebase Authentication before production.</p>
</main>
<script src="app.js"></script>
</body>
</html>
