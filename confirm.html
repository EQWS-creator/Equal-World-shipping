<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirm Email | Equal World Shipping</title>
  <meta name="description" content="Confirm your Equal World Shipping customer email address.">
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033;display:grid;place-items:center;min-height:100vh;padding:20px}
    .card{max-width:560px;width:100%;background:#fff;border-radius:16px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.08);text-align:center}
    h1{margin-top:0}.status{margin:18px 0;padding:14px;border-radius:10px;background:#f0f4f8;line-height:1.5}.success{background:#eaf8ef;color:#166534}.error{background:#fff0f0;color:#991b1b}
    a{display:inline-block;border-radius:10px;padding:12px 18px;font-weight:700;text-decoration:none;background:#0b63ce;color:#fff;margin:6px}
    small{display:block;color:#667085;margin-top:18px;line-height:1.5}
  </style>
</head>
<body>
  <main class="card">
    <h1>Email Confirmation</h1>
    <div id="status" class="status">Checking your confirmation…</div>
    <div id="actions"></div>
    <small>If the confirmation has expired, return to the customer sign-in page and request a new verification email.</small>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ypedqbffumjwccqmgauo.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_yaUpKhGqxpHxRwEIJrSO3g_bIVhMNHE";
    const PUBLIC_URL = "https://eqws-creator.github.io/Equal-World-shipping/";
    const AUTH_URL = PUBLIC_URL + "auth.html";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const status = document.getElementById("status");
    const actions = document.getElementById("actions");

    function addButton(href, text) {
      const a = document.createElement("a");
      a.href = href;
      a.textContent = text;
      actions.appendChild(a);
    }

    function showError(message) {
      status.className = "status error";
      status.textContent = message;
      addButton(AUTH_URL, "Return to Sign In");
    }

    async function confirmEmail() {
      // Supabase's standard confirmation endpoint redirects back here with
      // the authenticated session in the URL fragment. The Supabase client
      // automatically detects and stores that session in the browser.
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const query = new URLSearchParams(window.location.search);

      const errorCode = hash.get("error_code") || query.get("error_code");
      const errorDescription = hash.get("error_description") || query.get("error_description");
      if (errorCode || errorDescription) {
        return showError(decodeURIComponent(errorDescription || "The confirmation link is invalid or has expired."));
      }

      // Also support custom templates that send token_hash/type to this page.
      const tokenHash = query.get("token_hash");
      const type = query.get("type") || "email";
      if (tokenHash) {
        const { error } = await supabaseClient.auth.verifyOtp({ token_hash: tokenHash, type });
        if (error) return showError("This confirmation link is invalid or has expired. Please request a new verification email.");
      }

      // Give the client a moment to process the URL fragment, then verify the session.
      for (let attempt = 0; attempt < 10; attempt++) {
        const { data } = await supabaseClient.auth.getSession();
        if (data.session?.user?.email_confirmed_at) {
          status.className = "status success";
          status.textContent = "Your email has been verified successfully. You can now use your Equal World Shipping account.";
          addButton(PUBLIC_URL, "Continue to Equal World Shipping");
          return;
        }
        await new Promise(resolve => setTimeout(resolve, 250));
      }

      showError("We could not complete the confirmation. Request a new verification email and use the newest message.");
    }

    confirmEmail().catch(() => showError("We could not complete the confirmation. Please request a new verification email."));
  </script>
</body>
</html>
