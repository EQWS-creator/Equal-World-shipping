<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equal World Shipping — Admin Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><span class="brand-mark small">EW</span><div><b>Equal World</b><small>Shipping</small></div></div>
  <nav><button class="nav active" data-view="overview">Overview</button><button class="nav" data-view="shipments">Shipments</button><button class="nav" data-view="customers">Customers</button></nav>
  <button id="logout" class="logout">Sign out</button>
</aside>
<main class="main">
  <header class="topbar"><div><h1 id="pageTitle">Dashboard</h1><p class="muted">Shipment operations and tracking management</p></div><button id="addBtn" class="primary">+ Add shipment</button></header>

  <section id="overview" class="view">
    <div class="stats">
      <div class="stat"><span>Total shipments</span><strong id="totalStat">0</strong></div>
      <div class="stat"><span>In transit</span><strong id="transitStat">0</strong></div>
      <div class="stat"><span>Delivered</span><strong id="deliveredStat">0</strong></div>
      <div class="stat"><span>Pending</span><strong id="pendingStat">0</strong></div>
    </div>
    <div class="panel"><div class="panel-head"><h2>Recent shipments</h2><button class="text-btn" data-go="shipments">View all</button></div><div id="recentTable"></div></div>
  </section>

  <section id="shipments" class="view hidden">
    <div class="panel">
      <div class="panel-head"><h2>Shipments</h2><input id="search" class="search" placeholder="Search tracking, origin or destination"></div>
      <div id="shipmentTable"></div>
    </div>
  </section>

  <section id="customers" class="view hidden">
    <div class="panel"><div class="panel-head"><h2>Customers</h2></div><div id="customerTable"></div></div>
  </section>
</main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="panel-head"><h2 id="modalTitle">Add shipment</h2><button id="closeModal" class="icon-btn">×</button></div>
    <form id="shipmentForm" class="form-grid">
      <input type="hidden" id="shipmentId">
      <label>Tracking number<input id="tracking" required placeholder="EWS100003"></label>
      <label>Status<select id="status"><option>Pending</option><option>In Transit</option><option>Delivered</option><option>Exception</option></select></label>
      <label>Origin<input id="origin" required></label>
      <label>Current location<input id="currentLocation" required></label>
      <label>Destination<input id="destination" required></label>
      <label>Service<input id="service" required placeholder="International Express"></label>
      <label>Customer name<input id="customer"></label>
      <label>Estimated delivery<input id="eta" type="date"></label>
      <div class="form-actions"><button type="button" id="cancel" class="secondary">Cancel</button><button class="primary" type="submit">Save shipment</button></div>
    </form>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
