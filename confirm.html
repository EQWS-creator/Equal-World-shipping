<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirm Email - Equal World Shipping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1>Confirm your email</h1>
      <p id="confirm-status">Tap the button below to verify your Equal World Shipping account.</p>
      <button id="confirm-button" class="auth-submit" type="button">Confirm Email</button>
      <p><a href="./#account">Return to Equal World Shipping</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="confirm.js"></script>
</body>
</html>
